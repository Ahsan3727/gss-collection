name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck, Lint, Unit & Integration Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - name: Build Next.js
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gss_ci_dummy
          NEXTAUTH_SECRET: ci-dummy-nextauth-secret-not-for-production
          NEXTAUTH_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: admin@gsscollection.pk
          CLOUDINARY_CLOUD_NAME: demo
          CLOUDINARY_API_KEY: '1234567890'
          CLOUDINARY_API_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build

  e2e:
    name: Mobile Playwright E2E & Accessibility
    runs-on: ubuntu-latest
    needs: quality
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed E2E database
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gss_e2e
          NEXTAUTH_SECRET: ci-e2e-nextauth-secret-min-32-chars
          NEXTAUTH_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: admin@gsscollection.pk
          ADMIN_PASSWORD: ChangeMe123!
          CLOUDINARY_CLOUD_NAME: demo
          CLOUDINARY_API_KEY: '1234567890'
          CLOUDINARY_API_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run seed
      - name: Build production bundle
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gss_e2e
          NEXTAUTH_SECRET: ci-e2e-nextauth-secret-min-32-chars
          NEXTAUTH_URL: http://127.0.0.1:3000
          ADMIN_EMAIL: admin@gsscollection.pk
          ADMIN_PASSWORD: ChangeMe123!
          CLOUDINARY_CLOUD_NAME: demo
          CLOUDINARY_API_KEY: '1234567890'
          CLOUDINARY_API_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build
      - name: Run Playwright E2E
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gss_e2e
          NEXTAUTH_SECRET: ci-e2e-nextauth-secret-min-32-chars
          NEXTAUTH_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PORT: '3000'
          ADMIN_EMAIL: admin@gsscollection.pk
          ADMIN_PASSWORD: ChangeMe123!
          CLOUDINARY_CLOUD_NAME: demo
          CLOUDINARY_API_KEY: '1234567890'
          CLOUDINARY_API_SECRET: ci-dummy-secret
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          E2E_USE_EXISTING_DB: '1'
        run: npm run test:e2e
      - name: Run Lighthouse CI
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gss_e2e
          NEXTAUTH_SECRET: ci-e2e-nextauth-secret-min-32-chars
          NEXTAUTH_URL: http://127.0.0.1:3000
          CLOUDINARY_CLOUD_NAME: demo
          CLOUDINARY_API_KEY: '1234567890'
          CLOUDINARY_API_SECRET: ci-dummy-secret
          ADMIN_EMAIL: admin@gsscollection.pk
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npx @lhci/cli@0.14.x autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
